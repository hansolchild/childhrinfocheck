name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PSK를 Index.html에 빌드 시 주입
      # window.__HANSOL_PSK__ 자리에 실제 값 삽입
      - name: Inject PSK into HTML
        run: |
          sed -i "s|window.__HANSOL_PSK__ || ''|'${{ secrets.HANSOL_PSK }}'|g" Index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:    pages deploy . --project-name=hansol-checklist --branch=main
